<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>The Kind Garden</title>
  <style>
    body {
      font-family: 'Comic Sans MS', sans-serif;
      background-color: #f0fff4;
      text-align: center;
      padding: 40px;
    }
    h1 {
      font-size: 2.5em;
      color: #2f855a;
    }
    .garden {
      display: flex;
      justify-content: center;
      gap: 30px;
      margin-top: 40px;
    }
    .plant {
      width: 100px;
      height: 100px;
      border: 3px dashed #a0aec0;
      border-radius: 20px;
      background-color: #edf2f7;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2em;
      color: #718096;
    }
    button {
      background-color: #48bb78;
      color: white;
      font-size: 1em;
      padding: 12px 24px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      margin-top: 30px;
    }
    button:hover {
      background-color: #38a169;
    }
  </style>
</head>
<body>
  <h1>🌱 Welcome to The Kind Garden</h1>
  <p>Click below to plant a veggie for $1 and help an animal!</p>

  <div class="garden">
    <div class="plant">🥕</div>
    <div class="plant">🔒</div>
    <div class="plant">🔒</div>
  </div>

  <button onclick="alert('This would be a $1 payment to unlock the next plant.')">
    Plant a Veggie for $1
  </button>
</body>
</html>
